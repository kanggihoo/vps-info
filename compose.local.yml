# 로컬 개발용 덮어쓰기. vps-infra 없이 이 저장소만으로 뜨도록 전용 PostgreSQL과 네트워크를 둔다(ADR-0001).
# 실행: docker compose -f compose.yml -f compose.local.yml up --build
services:
  postgres:
    image: postgres:17
    environment: [POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 15
    networks: [vps_data]

  migrate:
    depends_on:
      postgres: { condition: service_healthy }

  app:
    command: ["node", "--watch", "src/server/main.ts"]
    ports: ["${APP_PORT:-8000}:8000"]  # 호스트 포트가 겹치면 .env의 APP_PORT로 바꾼다
    volumes: ["./src:/app/src"]

  collector:
    command: ["node", "--watch", "src/collector/main.ts"]
    volumes: ["./src:/app/src"]

  # DB 통합 테스트. `npm run test:db`로 실행하며 평소 `up`에는 뜨지 않는다.
  test:
    build: { context: ., target: test }
    profiles: [test]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 개발 DB와 섞이지 않도록 별도의 테스트 DB를 쓴다.
      POSTGRES_DB: ${POSTGRES_DB}_test
      RUN_DB_TESTS: "1"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [vps_data]

networks:
  vps_proxy:
    external: false
    name: signal_archive_local_proxy
  vps_data:
    external: false
    name: signal_archive_local_data

volumes:
  postgres_data:
