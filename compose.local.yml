services:
  backend:
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
