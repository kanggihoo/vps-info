[project]
name = "signal-archive"
version = "0.1.0"
description = "Archive links and metadata from tech/news sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "feedparser>=6.0.11",
    "fastapi>=0.116.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "tenacity>=9.1.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
signal-archive = "signal_archive.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["signal_archive*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
