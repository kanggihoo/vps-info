# 배포용 구성. PostgreSQL과 네트워크는 vps-infra가 소유한다.
# 프로젝트 이름을 고정한다. 없으면 Jenkins workspace 디렉터리 이름이 프로젝트 이름이 된다.
name: vps-info

x-database-env: &database-env
  environment: [POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD]

services:
  # 마이그레이션을 적용하고 종료한다. 성공해야 app과 collector가 뜬다.
  migrate:
    build: { context: ., target: base }
    command: ["node", "src/db/run-migrations.ts"]
    <<: *database-env
    networks: [vps_data]

  app:
    build: { context: ., target: app }
    # DB 환경 변수에 더해 번역 버튼용 DeepL 키를 받는다(ADR-0011). 비어 있으면 번역만 꺼진다.
    # LLM_URL은 Entry 대화를 넘길 llm 서비스 주소다(ADR-0015). 비우면 대화만 꺼진다.
    environment: [POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, DEEPL_API_KEY, "WANTED_PROXY_URL=${WANTED_PROXY_URL-http://100.66.95.61:18888}", "LLM_URL=${LLM_URL-http://llm:8100}"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    # slim 이미지에 curl이 없어 node로 확인한다. `up --wait`가 이 상태를 기다린다.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 12
    networks:
      vps_data: {}
      llm: {}
      # vps_proxy는 여러 프로젝트가 공유한다. 서비스 이름 `app`은 겹칠 수 있어 nginx는 이 alias로 찾는다.
      vps_proxy:
        aliases: [vps-info-app]

  collector:
    build: { context: ., target: collector }
    # 원티드는 VPS IP를 막아서 한국 IP의 프록시를 거친다(docs/sources/wanted.md). 비우면 직접 나간다.
    environment: [POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, PRODUCT_HUNT_CLIENT_ID, PRODUCT_HUNT_CLIENT_SECRET, "WANTED_PROXY_URL=${WANTED_PROXY_URL-http://100.66.95.61:18888}"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [vps_data]

  # Entry 대화 서비스(ADR-0015, ADR-0018). pi-ai로 Claude·OpenAI·OpenRouter를 HTTP로 부르고, 도구는 넘기지 않는다.
  # DB 네트워크에 붙지 않고, LLM 인증 정보 말고는 비밀값이 없다. 루트 파일시스템은 읽기 전용이고, 쓰기는 인증 볼륨에만 한다.
  # Claude·OpenAI 구독 로그인(llm_auth 볼륨의 auth.json): bash scripts/llm-login.sh anthropic|openai
  llm:
    build: { context: ., target: llm }
    environment: [OPENROUTER_API_KEY, LLM_AUTH_FILE=/llm-auth/auth.json]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=64m"]
    volumes: ["llm_auth:/llm-auth"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8100/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 12
    networks: [llm]

networks:
  # app과 llm만 붙는 네트워크. 외부로 나가는 길은 열려 있어야 llm이 Anthropic·OpenAI·OpenRouter에 닿는다.
  llm: {}
  vps_proxy:
    external: true
    name: vps_proxy
  vps_data:
    external: true
    name: vps_data

volumes:
  # Claude·OpenAI 구독 로그인 파일(auth.json, pi-ai CLI 형식). pi-ai가 토큰을 갱신하면 llm이 여기에 되돌려 쓴다.
  llm_auth:
