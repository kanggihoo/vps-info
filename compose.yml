services:
  backend:
    build: .
    environment: [POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD]
    networks: [vps_proxy, vps_data]

  frontend:
    build:
      context: ./frontend
    networks: [vps_proxy]

  collector:
    build: .
    command: ["signal-archive", "collect", "--limit", "20"]
    environment: [POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD]
    networks: [vps_data]

networks:
  vps_proxy:
    external: true
    name: vps_proxy
  vps_data:
    external: true
    name: vps_data
