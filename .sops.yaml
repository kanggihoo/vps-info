# SOPS 암호화 규칙. vps-infra와 같은 age 공개키를 써서 VPS Jenkins의 key 하나로 복호화한다.
# 복호화할 때 SOPS는 이 규칙이 아니라 파일 확장자로 형식을 판단하므로 `.sops.env`로 끝낸다.
creation_rules:
  - path_regex: (^|/)secrets/env\..*\.sops\.env$
    input_type: dotenv
    output_type: dotenv
